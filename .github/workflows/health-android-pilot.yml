name: Android Health Pilot (hardware test only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/health-android-pilot.yml'
jobs:
  build-pilot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and run offline BLE parser tests
        run: |
          mkdir -p /tmp/health-java-test
          javac -d /tmp/health-java-test android/app/src/main/java/com/nathoeng/healthpilot/BleMeasurement.java android/tests/com/nathoeng/healthpilot/BleMeasurementTest.java
          java -cp /tmp/health-java-test com.nathoeng.healthpilot.BleMeasurementTest
      - name: Build Android debug hardware-only pilot
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Archive testing APK (not production)
        uses: actions/upload-artifact@v4
        with:
          name: Nathoeng-Health-Android-OTG-BLE-PILOT
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

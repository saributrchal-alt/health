name: Health Android Pilot - Debug Build

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "android/**"
      - ".github/workflows/health-android-pilot-debug.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/health-android-pilot-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Compile unsigned Health pilot source (debug APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
          cache-provider: basic
      - name: Build debug APK (no production signing credentials)
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Upload test-only debug APK
        uses: actions/upload-artifact@v4
        with:
          name: health-pilot-debug-test-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
